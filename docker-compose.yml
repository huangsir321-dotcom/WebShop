# FORME v3 - the whole site in one command: a PostgreSQL database and the
# API (which also serves the storefront).
#
#   docker compose up --build      -> http://localhost:4000
#
# The values below are read from the .env file in this directory when it
# exists, and fall back to development defaults when it does not.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forme_dev_password}
      POSTGRES_DB: forme
    ports:
      - "5432:5432"
    volumes:
      - forme_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forme -d forme"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: .
    restart: unless-stopped
    environment:
      # Inside the compose network the database answers to the host name
      # "db", not to localhost.
      DATABASE_URL: postgresql://forme:${POSTGRES_PASSWORD:-forme_dev_password}@db:5432/forme?schema=public
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-secret-of-32-plus-characters}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-you-deploy}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  forme_postgres_data:
