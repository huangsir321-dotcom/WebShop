<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORME Admin</title><link rel="stylesheet" href="admin.css"></head>
<body><div class="login-wrap" id="loginWrap"><form id="loginForm" class="login-card"><div class="logo">FORME<span>.</span></div><p class="eyebrow">STORE ADMINISTRATION</p><h1>Sign in</h1><label>Email</label><input type="email" id="email" required autocomplete="username" value="admin@example.com"><label>Password</label><input type="password" id="password" required autocomplete="current-password"><button class="primary">Sign in to dashboard ↗</button><p class="hint">Sign in with the ADMIN_EMAIL and ADMIN_PASSWORD from your .env file. The password is never stored in this page.</p><p id="loginError" class="error"></p></form></div>
<div class="app hidden" id="app"><aside class="sidebar"><a class="logo" href="#">FORME<span>.</span></a><p class="eyebrow">COMMERCE CONTROL</p><div class="nav"><button class="nav-item active" data-view="dashboard">◫ <span>Overview</span></button><button class="nav-item" data-view="products">▦ <span>Products</span></button><button class="nav-item" data-view="homepage">⌂ <span>Homepage</span></button><button class="nav-item" data-view="orders">▤ <span>Orders</span></button><button class="nav-item" data-view="inventory">▥ <span>Inventory</span></button><button class="nav-item" data-view="customers">♙ <span>Customers</span></button><button class="nav-item" data-view="coupons">◇ <span>Coupons</span></button><button class="nav-item" data-view="reports">▤ <span>Reports</span></button></div><div class="side-bottom"><span id="userName">Administrator</span><button id="logoutBtn">Sign out ↗</button></div></aside><main class="main"><header class="topbar"><div><p class="eyebrow">FORME / ADMIN</p><h1 id="pageTitle">Overview</h1></div><span class="status"><i></i> API workspace</span></header><section id="view" class="view"><div class="loading">Connect to the API to load your store data…</div></section></main></div>
<div id="toast" class="toast"></div><script src="admin.js"></script></body></html>
